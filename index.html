<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>볏짚환원사업_필지조사</title>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=48a43660c47d975dfae7166c8cf43b55&autoload=false"></script>
    <style>
        html, body { 
            width: 100%; 
            height: 100%; 
            height: -webkit-fill-available;
            margin: 0; 
            padding: 0; 
            overflow: hidden;
        }
        #map { 
            width: 100%; 
            height: 100vh; 
            height: 100dvh;
            position: relative; 
        }
        
        /* 아이폰 iOS 대응 버튼 컨테이너 스타일 */
        .btn-container {
            position: fixed;
            bottom: calc(30px + env(safe-area-inset-bottom, 0px));
            right: 20px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        .map-control-btn {
            background-color: #ffffff;
            color: #333333;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            -webkit-appearance: none;
        }
        .map-control-btn.active {
            background-color: #e6f7ff;
            border-color: #1890ff;
            color: #1890ff;
        }

        /* 정보창 스타일 */
        .info-card { padding: 8px 10px; font-size: 13px; text-align: center; line-height: 1.4; min-width: 140px; }
        .info-title { font-weight: bold; font-size: 13px; margin-bottom: 6px; color: #333; }
        .btn-group { display: flex; gap: 4px; justify-content: center; margin-top: 4px; }
        .btn-map { 
            display: inline-block; padding: 3px 6px; font-size: 11px; 
            background-color: #fee500; color: #000; text-decoration: none; 
            border-radius: 3px; font-weight: bold; 
        }
        .btn-navi { 
            display: inline-block; padding: 3px 6px; font-size: 11px; 
            background-color: #2db400; color: #fff; text-decoration: none; 
            border-radius: 3px; font-weight: bold; 
        }
    </style>
</head>
<body>

<div id="map">
    <div class="btn-container">
        <!-- 지적편집도 토글 버튼 -->
        <button id="cadastralBtn" class="map-control-btn active" onclick="toggleCadastralLayer()">📐 지적 경계선 (ON)</button>
        <!-- 실시간 위치 추적 토글 버튼 -->
        <button id="locBtn" class="map-control-btn" onclick="toggleLocationTracking()">📍 내 위치 실시간 추적</button>
    </div>
</div>

<script>
var map, myLocationMarker = null, watchId = null;
var isTracking = false;
var isCadastralShow = true;

window.onload = function() {
    if (typeof kakao === 'undefined' || !kakao.maps) {
        alert("카카오 지도 SDK를 불러오지 못했습니다.");
        return;
    }

    kakao.maps.load(function() {
        var mapContainer = document.getElementById('map'),
            mapOption = { 
                center: new kakao.maps.LatLng(35.78, 127.09),
                level: 7
            };

        map = new kakao.maps.Map(mapContainer, mapOption);

        // 스카이뷰(HYBRID) 기본 적용
        map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);

        // 지적편집도(필지 경계선 및 지번 레이어) 기본 켜기
        map.addOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);

        // 지도/스카이뷰 및 확대/축소 컨트롤 추가
        var mapTypeControl = new kakao.maps.MapTypeControl();
        map.addControl(mapTypeControl, kakao.maps.ControlPosition.TOPRIGHT);

        var zoomControl = new kakao.maps.ZoomControl();
        map.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

        var locations = [
            { title: '삼천동3가 785-28', lat: 35.8034171594347, lng: 127.075730082059 },
{ title: '삼천동3가 산232', lat: 35.8047367988502, lng: 127.068024895558 },
{ title: '삼천동3가 640', lat: 35.7899879291887, lng: 127.07803940783 },
{ title: '삼천동3가 180-4', lat: 35.7903138480316, lng: 127.089157314896 },
{ title: '삼천동3가 180-10', lat: 35.7896356489438, lng: 127.089638402103 },
{ title: '삼천동3가 495-2', lat: 35.7958974141215, lng: 127.079714406805 }
        ];

        var bounds = new kakao.maps.LatLngBounds();
        var activeInfowindow = null;

        locations.forEach(function(loc) {
            if (!loc.lat || !loc.lng) return;
            
            var position = new kakao.maps.LatLng(loc.lat, loc.lng);
            var marker = new kakao.maps.Marker({
                map: map,
                position: position
            });

            var fullTitle = "전북 전주시 완산구 " + loc.title;
            var mapUrl = "https://map.kakao.com/link/map/" + encodeURIComponent(fullTitle) + "," + loc.lat + "," + loc.lng;
            var naviUrl = "https://map.kakao.com/link/to/" + encodeURIComponent(fullTitle) + "," + loc.lat + "," + loc.lng;

            var contentHtml = 
                '<div class="info-card">' +
                    '<div class="info-title">' + loc.title + '</div>' +
                    '<div class="btn-group">' +
                        '<a href="' + mapUrl + '" target="_blank" class="btn-map">카카오맵</a>' +
                        '<a href="' + naviUrl + '" target="_blank" class="btn-navi">길찾기</a>' +
                    '</div>' +
                '</div>';

            var infowindow = new kakao.maps.InfoWindow({
                content: contentHtml,
                removable: true
            });

            kakao.maps.event.addListener(marker, 'click', function() {
                if (activeInfowindow) {
                    activeInfowindow.close();
                }
                infowindow.open(map, marker);
                activeInfowindow = infowindow;
            });

            bounds.extend(position);
        });

        if (locations.length > 0) {
            map.setBounds(bounds);
        }
    });
};

// 지적편집도 레이어 ON/OFF 토글
function toggleCadastralLayer() {
    var btn = document.getElementById('cadastralBtn');
    if (isCadastralShow) {
        map.removeOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
        isCadastralShow = false;
        btn.classList.remove('active');
        btn.innerText = '📐 지적 경계선 (OFF)';
    } else {
        map.addOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
        isCadastralShow = true;
        btn.classList.add('active');
        btn.innerText = '📐 지적 경계선 (ON)';
    }
}

// 실시간 내 위치 추적 토글 기능 (ON/OFF)
function toggleLocationTracking() {
    var locBtn = document.getElementById('locBtn');

    if (!navigator.geolocation) {
        alert("이 브라우저에서는 위치 서비스를 지원하지 않습니다.");
        return;
    }

    if (isTracking) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        isTracking = false;
        locBtn.classList.remove('active');
        locBtn.innerText = '📍 내 위치 실시간 추적';
        
        if (myLocationMarker) {
            myLocationMarker.setMap(null);
            myLocationMarker = null;
        }
    } else {
        isTracking = true;
        locBtn.classList.add('active');
        locBtn.innerText = '📡 추적 중 (터치 시 종료)';

        var isFirstMove = true;

        watchId = navigator.geolocation.watchPosition(
            function(position) {
                var lat = position.coords.latitude;
                var lng = position.coords.longitude;
                var locPosition = new kakao.maps.LatLng(lat, lng);

                if (!myLocationMarker) {
                    var markerImage = new kakao.maps.MarkerImage(
                        'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png', 
                        new kakao.maps.Size(24, 35)
                    );

                    myLocationMarker = new kakao.maps.Marker({
                        map: map,
                        position: locPosition,
                        image: markerImage
                    });
                } else {
                    myLocationMarker.setPosition(locPosition);
                }

                if (isFirstMove) {
                    map.setCenter(locPosition);
                    map.setLevel(3, { animate: true });
                    isFirstMove = false;
                }
            },
            function(error) {
                alert("위치 정보를 가져오는 중 오류가 발생했습니다: " + error.message);
                toggleLocationTracking();
            },
            {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 10000
            }
        );
    }
}
</script>
</body>
</html>
